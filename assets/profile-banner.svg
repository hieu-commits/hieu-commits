<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Hieu — Software, Networks, Security and Cloud</title>
<desc id="desc">A dark futuristic banner with neon cyan and violet systems diagrams, connecting code, networks, security, cloud and IoT.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#050B18"/><stop offset=".48" stop-color="#08162D"/><stop offset="1" stop-color="#10102E"/></linearGradient>
  <linearGradient id="titleGrad" x1="140" y1="85" x2="690" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#F5FBFF"/><stop offset=".5" stop-color="#63E7FF"/><stop offset="1" stop-color="#9C8CFF"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20E7F5"/><stop offset="1" stop-color="#1687FF"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B58CFF"/><stop offset="1" stop-color="#6D42FF"/></linearGradient>
  <radialGradient id="glowA"><stop stop-color="#057EFF" stop-opacity=".28"/><stop offset="1" stop-color="#057EFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop stop-color="#8A45FF" stop-opacity=".22"/><stop offset="1" stop-color="#8A45FF" stop-opacity="0"/></radialGradient>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#35628E" stroke-opacity=".16" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="300" rx="24" fill="url(#bg)"/>
<rect width="1200" height="300" rx="24" fill="url(#grid)"/>
<ellipse cx="915" cy="130" rx="340" ry="250" fill="url(#glowA)"/>
<ellipse cx="1070" cy="45" rx="250" ry="200" fill="url(#glowB)"/>
