<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="320" viewBox="0 0 1500 320" role="img" aria-labelledby="title desc">
<title id="title">Hieu — Systems, Software and Infrastructure</title>
<desc id="desc">A futuristic dark navy banner with cyan and violet circuit lines, network nodes, cloud infrastructure and software panels.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071127"/><stop offset=".52" stop-color="#0b1b3b"/><stop offset="1" stop-color="#170d38"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#52f7ff"/><stop offset="1" stop-color="#1688ff"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ec71ff"/><stop offset="1" stop-color="#7856ff"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#32f5cc"/><stop offset="1" stop-color="#16a9ff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#087bff" stop-opacity=".35"/><stop offset="1" stop-color="#087bff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#4c87c9" stroke-opacity=".12" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1500" height="320" rx="26" fill="url(#bg)"/>
<rect width="1500" height="320" rx="26" fill="url(#grid)"/>
<ellipse cx="1090" cy="155" rx="440" ry="260" fill="url(#glow)"/>
<circle cx="1310" cy="40" r="120" fill="#8d39ff" opacity=".14" filter="url(#blur)"/>
<path d="M0 272H240L290 222H440L490 272H665" fill="none" stroke="url(#cyan)" stroke-width="2" opacity=".36"/>
<path d="M870 0V45L916 91H1040L1081 132H1240L1300 72H1500" fill="none" stroke="url(#violet)" stroke-width="2" opacity=".54"/>
<g opacity=".9" stroke="url(#cyan)" stroke-width="2" fill="none">
  <path d="M910 240H1010L1050 200H1134L1170 164H1242"/><path d="M970 286V250L1002 218"/><path d="M1120 285V250L1156 214H1230"/>
  <path d="M1200 80V118L1230 148H1320L1368 196"/>
</g>
<g filter="url(#softGlow)">
  <circle cx="910" cy="240" r="5" fill="#58f6ff"/><circle cx="1010" cy="240" r="5" fill="#58f6ff"/><circle cx="1134" cy="200" r="5" fill="#58f6ff"/><circle cx="1242" cy="164" r="5" fill="#58f6ff"/>
  <circle cx="1230" cy="148" r="5" fill="#d17aff"/><circle cx="1368" cy="196" r="5" fill="#d17aff"/><circle cx="1320" cy="148" r="5" fill="#d17aff"/>
</g>
<!-- abstract server stack -->
<g transform="translate(1010 88)">
  <rect x="0" y="0" width="100" height="164" rx="12" fill="#0a1530" stroke="#2778d9" stroke-opacity=".9"/>
  <rect x="12" y="14" width="76" height="34" rx="6" fill="#0e2e58" stroke="#26cfff" stroke-opacity=".7"/>
  <rect x="12" y="60" width="76" height="34" rx="6" fill="#101e49" stroke="#6b83ff" stroke-opacity=".7"/>
  <rect x="12" y="106" width="76" height="34" rx="6" fill="#0b3146" stroke="#31e7c2" stroke-opacity=".7"/>
  <g fill="#56f7ff"><circle cx="24" cy="31" r="3"/><circle cx="24" cy="77" r="3"/><circle cx="24" cy="123" r="3"/></g>
  <g stroke="#67b9ff" stroke-width="2" opacity=".6"><path d="M35 31H75M35 77H75M35 123H75"/></g>
</g>
<!-- cloud -->
<g transform="translate(1190 54)" filter="url(#softGlow)">
 <path d="M38 100H132a31 31 0 0 0 0-62 44 44 0 0 0-84-7A36 36 0 0 0 38 100Z" fill="#101d49" stroke="url(#violet)" stroke-width="3"/>
 <path d="M63 75l17 17 29-34" fill="none" stroke="#61f4fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- code panel -->
<g transform="translate(1335 140)">
  <rect width="116" height="112" rx="12" fill="#091328" stroke="#3e8dff" stroke-opacity=".9"/>
  <path d="M0 28H116" stroke="#3e8dff" stroke-opacity=".45"/>
  <circle cx="15" cy="14" r="3" fill="#ff668f"/><circle cx="27" cy="14" r="3" fill="#ffcc67"/><circle cx="39" cy="14" r="3" fill="#45e5ba"/>
  <g stroke-linecap="round" stroke-width="4"><path d="M14 46H56" stroke="#53dfff"/><path d="M23 59H85" stroke="#9a7cff"/><path d="M14 72H70" stroke="#29e6c3"/><path d="M23 85H59" stroke="#5794ff"/><path d="M67 46H98" stroke="#e58fff"/></g>
</g>
<!-- left text -->
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="66" y="81" fill="#61eaff" font-size="15" font-weight="700" letter-spacing="5">HI, I'M HIEU</text>
  <text x="62" y="145" fill="#f5f8ff" font-size="54" font-weight="800" letter-spacing="-1.5">Building systems</text>
  <text x="62" y="205" fill="#f5f8ff" font-size="54" font-weight="800" letter-spacing="-1.5">that <tspan fill="url(#cyan)">connect</tspan> &amp; <tspan fill="url(#violet)">scale</tspan>.</text>
  <text x="66" y="250" fill="#a9bddf" font-size="20" font-weight="500">SOFTWARE  ·  NETWORKS  ·  SECURITY  ·  DEVOPS  ·  DATA  ·  IoT  ·  CLOUD</text>
</g>
<rect x="1" y="1" width="1498" height="318" rx="25" fill="none" stroke="#4b94ed" stroke-opacity=".48"/>
</svg>