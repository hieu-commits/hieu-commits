<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc">
<title id="title">Network Infrastructure Lab</title><desc id="desc">Vivid network diagram with router, switches and connected nodes.</desc>
